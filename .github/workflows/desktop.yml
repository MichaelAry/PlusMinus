name: Desktop Qt builds and portable releases

on:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit of a branch needs the full desktop build matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: macos-x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make python3-venv xvfb libegl1 libopengl0 libxcb-cursor0

      - name: Build C++ runner (Linux)
        if: runner.os == 'Linux'
        run: python3 launch.py --no-install --build-only

      - name: Build C++ runner (Windows/macOS)
        if: runner.os != 'Linux'
        run: python launch.py --no-install --build-only

      - name: Unit and interpreter tests (Linux)
        if: runner.os == 'Linux'
        run: |
          ctest --test-dir ide/build -C Release --output-on-failure
          python3 ide/smoke_test.py
          python3 -c "import sys; sys.path.insert(0,'ide'); from native_tests import discover_native_tests, find_native_runner; assert len(discover_native_tests(find_native_runner())) == 225"
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m venv .venv
          .venv/bin/python -m pip install -r ide/requirements.txt pyinstaller==6.16.0
          QT_QPA_PLATFORM=offscreen .venv/bin/python ide/studio_qt.py --self-test
          QT_QPA_PLATFORM=offscreen .venv/bin/python tools/smoke_qt.py
          QT_QPA_PLATFORM=offscreen .venv/bin/python ide/studio_qt.py --safe-mode --gui-smoke
          QT_QPA_PLATFORM=offscreen .venv/bin/python -c 'from PySide6.QtWidgets import QApplication; app=QApplication([]); print("Qt OK")'

      - name: C++ CTest (Windows/macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: ctest --test-dir ide/build -C Release --output-on-failure

      - name: Python runner and module tests (Windows/macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: |
          python ide/smoke_test.py
          python -c "import sys; sys.path.insert(0,'ide'); from native_tests import discover_native_tests, find_native_runner; assert len(discover_native_tests(find_native_runner())) == 225"
          python -m unittest discover -s tools -p "test_*.py"

      - name: Install GUI dependencies (Windows/macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 15
        run: python -m pip install -r ide/requirements.txt pyinstaller==6.16.0

      - name: Qt backend self-test (Windows/macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: python -u ide/studio_qt.py --self-test

      - name: Qt window navigation smoke (Windows/macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: python -u tools/smoke_qt.py

      # Prior Qt tests forced the offscreen platform on ALL operating systems.
      # A native Windows access violation in QWidget.show() was therefore not
      # covered. Exercise the real Windows platform plugin before packaging.
      - name: Native Windows window startup (display/Qt safe mode)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          PLUSMINUS_DIAGNOSTICS: "1"
        run: |
          python -u ide/studio_qt.py --qt-probe
          python -u ide/studio_qt.py --safe-mode --gui-smoke
          python -u ide/studio_qt.py --gui-smoke

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python tools/package.py
          QT_QPA_PLATFORM=offscreen .venv/bin/python ide/studio_qt.py --self-test
          QT_QPA_PLATFORM=offscreen ./dist/PlusMinusStudio --self-test

      - name: Package (Windows/macOS)
        if: runner.os != 'Linux'
        run: python tools/package.py

      - name: Test bundled Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\dist\PlusMinusStudio.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bundled self-test failed with $($p.ExitCode)" }

      - name: Test bundled macOS application
        if: runner.os == 'macOS'
        run: dist/PlusMinusStudio.app/Contents/MacOS/PlusMinusStudio --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: PlusMinusStudio-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

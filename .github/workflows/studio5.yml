name: Studio 5 Tauri foundation (experimental)

on:
  push:
    branches: ['master']
    paths:
      - 'apps/studio/**'
      - 'scripts/stage-native.mjs'
      - 'scripts/verify-native-isolation.mjs'
      - 'scripts/smoke-packaged-linux.sh'
      - 'scripts/check-qt-native-parity.py'
      - 'docs/migration/**'
      - '.github/workflows/studio5.yml'
      - 'src/**'
      - 'include/**'
      - 'ide/runner.cpp'
      - 'tests/**'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'scripts/stage-native.mjs'
      - 'scripts/verify-native-isolation.mjs'
      - 'scripts/smoke-packaged-linux.sh'
      - 'scripts/check-qt-native-parity.py'
      - 'docs/migration/**'
      - '.github/workflows/studio5.yml'
      - 'src/**'
      - 'include/**'
      - 'ide/runner.cpp'
      - 'tests/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            triple: x86_64-pc-windows-msvc
          - platform: linux-x64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - platform: macos-x64
            os: macos-15-intel
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Verify C++ core and Qt files remain unchanged
        shell: bash
        run: |
          git fetch --no-tags origin 41360ed7f470dd76da264b24ff74171ef55da5c2 --depth=1
          git diff --exit-code 41360ed7f470dd76da264b24ff74171ef55da5c2 HEAD -- \
            src/ include/ ide/ tests/cpp/ tests/portable/ \
            CMakeLists.txt launch.py .github/workflows/desktop.yml

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/studio/src-tauri -> target'

      - name: Configure original C++ project
        run: cmake -S . -B build/studio5 -DCMAKE_BUILD_TYPE=Release

      - name: Build original C++ binaries
        run: cmake --build build/studio5 --config Release --parallel 2

      - name: Native C++ smoke and quick suite
        run: ctest --test-dir build/studio5 -C Release --output-on-failure

      - name: Verify all 225 C++ tests in independent processes
        run: node scripts/verify-native-isolation.mjs --build-dir build/studio5

      - name: Stage sidecars for Tauri
        run: node scripts/stage-native.mjs --build-dir build/studio5 --target ${{ matrix.triple }}

      - name: Smoke native C++ process protocol
        run: node scripts/smoke-native.mjs --build-dir build/studio5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare Qt execution adapter against native C++ reports
        run: python scripts/check-qt-native-parity.py --build-dir build/studio5

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund

      - name: Frontend tests and typecheck
        working-directory: apps/studio
        run: |
          npm run test
          npm run typecheck
          npm run lint:types
          npm run build:ui

      - name: Rust typecheck, unit tests and Clippy
        working-directory: apps/studio/src-tauri
        shell: bash
        run: |
          cargo check --all-targets
          cargo test
          cargo clippy --all-targets

      - name: Tauri package (Windows and Linux)
        if: runner.os != 'macOS'
        working-directory: apps/studio
        run: npm run tauri build

      - name: Tauri package (macOS with bounded DMG eject retry)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/studio
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/tauri-package-${attempt}.log"
            echo "macOS Tauri package attempt ${attempt}/3"
            if npm run tauri build 2>&1 | tee "$log"; then
              exit 0
            fi
            # macOS CI sometimes refuses to eject the temporary RW dmg
            # (hdiutil: Resource busy), after the application has compiled.
            # Retry only that known transient packaging error; do not mask
            # Rust/compiler, configuration or missing-sidecar failures.
            if ! grep -qiE "(hdiutil:.*Resource busy|couldn't eject.*Resource busy)" "$log"; then
              echo "Non-transient Tauri packaging failure" >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "macOS DMG eject remained busy after three attempts" >&2
              exit 1
            fi
            hdiutil info || true
            sync
            sleep $((15 * attempt))
          done

      - name: Smoke installed-layout Linux sidecars and GUI startup
        if: runner.os == 'Linux'
        run: bash scripts/smoke-packaged-linux.sh

      - name: Verify package output
        shell: bash
        run: |
          test -d apps/studio/src-tauri/target/release/bundle
          find apps/studio/src-tauri/target/release/bundle -maxdepth 2 -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: PlusMinus-Studio5-${{ matrix.platform }}
          path: apps/studio/src-tauri/target/release/bundle/
          if-no-files-found: error
